[project]
name = "ComfyUI-BytePlus-ModelArk"
description = "ComfyUI nodes for BytePlus ModelArk (Seedream, Seedance, Seed/DeepSeek/GLM LLMs, Hyper3D and Hitem3D 3D models), Seed Speech (Seed Audio, TTS, ASR) and AI MediaKit (video and image enhancement), billed to your own BytePlus account."
version = "0.6.0"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent"]
dependencies = ["byteplus-python-sdk-v2[ark]>=3.0.61", "httpx", "sniffio"]

[project.urls]
Repository = "https://github.com/byteplus-sa/ComfyUI-BytePlus-ModelArk"
Issues = "https://github.com/byteplus-sa/ComfyUI-BytePlus-ModelArk/issues"

[tool.comfy]
PublisherId = "byteplus-sa"
DisplayName = "ComfyUI BytePlus ModelArk & AI MediaKit"
Icon = "https://raw.githubusercontent.com/byteplus-sa/ComfyUI-BytePlus-ModelArk/main/assets/registry-icon.jpg"
requires-comfyui = ">=0.31.0"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".claude/worktrees"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/*" = ["B017", "E731"]
