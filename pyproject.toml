[project]
name = "ComfyUI-BytePlus-ModelArk"
description = "ComfyUI nodes for BytePlus ModelArk: Seedance video, Seedream image, and Seed multimodal understanding, billed to your own ModelArk account."
version = "0.2.2"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent"]
dependencies = ["byteplus-python-sdk-v2[ark]>=3.0.61", "httpx", "sniffio"]

[project.urls]
Repository = "https://github.com/byteplus-sa/ComfyUI-BytePlus-ModelArk"
Issues = "https://github.com/byteplus-sa/ComfyUI-BytePlus-ModelArk/issues"

[tool.comfy]
PublisherId = "byteplus-sa"
DisplayName = "ComfyUI BytePlus ModelArk"
Icon = "https://raw.githubusercontent.com/byteplus-sa/ComfyUI-BytePlus-ModelArk/main/assets/registry-icon.jpg"
requires-comfyui = ">=0.25.1"
