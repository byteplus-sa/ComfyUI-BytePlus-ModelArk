[project]
name = "ComfyUI-BytePlus-ModelArk"
description = "ComfyUI nodes for BytePlus ModelArk (Seedream, Seedance, Seed Audio 1.5, Seed/DeepSeek/GLM LLMs, Hyper3D and Hitem3D), Seed Speech (Seed Audio 1.0, TTS, ASR), Vision AI (OmniHuman avatars) and AI MediaKit enhancement, billed to your BytePlus account. Docs: https://byteplus-sa.github.io/ComfyUI-BytePlus-ModelArk/"
version = "0.13.0"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent"]
dependencies = ["byteplus-python-sdk-v2[ark]>=3.0.61", "httpx", "sniffio"]

[project.urls]
Documentation = "https://byteplus-sa.github.io/ComfyUI-BytePlus-ModelArk/"
Repository = "https://github.com/byteplus-sa/ComfyUI-BytePlus-ModelArk"
Issues = "https://github.com/byteplus-sa/ComfyUI-BytePlus-ModelArk/issues"

[tool.comfy]
PublisherId = "byteplus-sa"
DisplayName = "ComfyUI BytePlus ModelArk, Speech, OmniHuman & MediaKit"
Icon = "https://raw.githubusercontent.com/byteplus-sa/ComfyUI-BytePlus-ModelArk/main/assets/registry-icon.jpg"
requires-comfyui = ">=0.31.0"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".claude/worktrees"]

[tool.ruff.format]
quote-style = "double"
# Code blocks in Markdown keep their hand-aligned comments. The two Seedream
# files are formatted once PR #20 (which edits them) has merged.
exclude = ["*.md", "nodes/nodes_seedream.py", "tests/test_core_style_seedream.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/*" = ["B017", "E731"]
