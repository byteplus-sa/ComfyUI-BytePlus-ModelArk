name: Docs

# Builds the documentation site (docs-site/, Astro Starlight) on every change to it, and
# publishes it to GitHub Pages from main. Needs Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["docs-site/**", "example_workflows/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs-site/**", "example_workflows/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older build of the same pull request; main builds and deploys never cancel.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      # Format of every node and template page, images, media, banned text.
      - run: node scripts/check-docs.mjs --strict
      # Also validates every internal link.
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
