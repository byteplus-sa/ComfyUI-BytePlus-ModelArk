name: Tests

# Runs on every change, and weekly against ComfyUI master: the core-style nodes
# copy ComfyUI core's ByteDance nodes, and the parity tests import core's nodes
# live, so a change in core fails here before users notice it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  # The publish workflow runs these tests before it tags and publishes.
  workflow_call:
    inputs:
      comfyui:
        description: JSON list of ComfyUI versions to test against (latest-release, master)
        type: string
        default: '["latest-release", "master"]'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uvx ruff@0.17.1 check .
      - run: for file in web/js/*.js; do node --check "$file"; done

  templates:
    name: Example workflows (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10: test the oldest and the current version.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest tests.test_workflow_templates tests.test_agent_files tests.test_docs_data

  nodes:
    name: Nodes and core parity (ComfyUI ${{ matrix.comfyui }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest release is what users run; master shows core's next changes.
        comfyui: ${{ fromJSON(inputs.comfyui || '["latest-release", "master"]') }}
        python: ["3.12"]
        # The oldest Python that requires-python allows, against the release users run.
        include:
          - comfyui: latest-release
            python: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pack
      - name: Pick the ComfyUI version
        id: comfyui
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.comfyui }}
        run: |
          if [ "$TARGET" = latest-release ]; then
            ref="$(gh api repos/Comfy-Org/ComfyUI/releases/latest --jq .tag_name)"
          else
            ref=master
          fi
          echo "Testing against ComfyUI $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ steps.comfyui.outputs.ref }}
          path: ComfyUI
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            ComfyUI/requirements.txt
            pack/requirements.txt
      - name: Install ComfyUI and this pack
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt
          pip install -r pack/requirements.txt
      - name: Run the tests
        working-directory: pack
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/ComfyUI
        # A skip means core's nodes or a dependency could not be imported: the
        # parity checks did not run, so treat it as a failure.
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . 2>&1 | tee test.log
          if grep -q "skipped=" test.log; then
            echo "::error::Some tests were skipped, so core parity was not fully checked."
            exit 1
          fi
