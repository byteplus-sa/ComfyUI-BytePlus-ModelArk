name: Tag and Publish
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    # Publish only from main; a dispatch on another branch would ship that branch.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml
    with:
      comfyui: '["latest-release"]'
    permissions:
      contents: read

  create-version-tag:
    name: Create version tag from pyproject
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from pyproject.toml
        id: project_version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        shell: bash
        env:
          TAG: ${{ steps.project_version.outputs.tag }}
        run: |
          git fetch --tags
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Skip creating."
            exit 0
          fi
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.project_version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Skip creating."
            exit 0
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes \
            --target "${GITHUB_SHA}"

  publish-node:
    name: Publish Custom Node to Registry
    needs: create-version-tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same steps as Comfy-Org/publish-node-action, with comfy-cli pinned in .github/publish/requirements.txt.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/publish/requirements.txt

      - name: Install comfy-cli
        run: pip install -r .github/publish/requirements.txt

      - name: Publish Custom Node
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
